<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Photo Card Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📸 News Photo Card Generator</h1>
        
        <div class="controls-section">
            <div class="control-group">
                <label for="photoInput">Upload Photo:</label>
                <input type="file" id="photoInput" accept="image/*">
                <small>Upload your event or news photo (16:4 aspect ratio recommended)</small>
            </div>

            <div class="control-group">
                <label for="headlineInput">Headline:</label>
                <input type="text" id="headlineInput" placeholder="Enter news headline" maxlength="100">
            </div>

            <div class="control-group">
                <label for="descriptionInput">Description:</label>
                <textarea id="descriptionInput" placeholder="Enter news description" maxlength="200" rows="3"></textarea>
            </div>

            <div class="control-group">
                <label for="dateInput">Date:</label>
                <input type="date" id="dateInput">
            </div>

            <div class="control-group">
                <label for="logoSelect">Select Logo Position:</label>
                <select id="logoSelect">
                    <option value="left">Left Logo</option>
                    <option value="right">Right Logo</option>
                    <option value="both">Both Logos</option>
                </select>
            </div>

            <div class="button-group">
                <button id="downloadBtn" class="btn btn-primary">📥 Download Card</button>
                <button id="resetBtn" class="btn btn-secondary">🔄 Reset</button>
            </div>
        </div>

        <div class="preview-section">
            <h2>Preview</h2>
            <div id="cardContainer" class="card-container">
                <!-- Card Preview -->
                <div class="news-card">
                    <!-- Left Logo -->
                    <div class="logo-section left-logo">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='95' fill='%2322c55e'/%3E%3Ccircle cx='100' cy='100' r='70' fill='%23ef4444'/%3E%3Cpath d='M100 60 L110 95 L145 95 L120 115 L130 150 L100 130 L70 150 L80 115 L55 95 L90 95 Z' fill='white'/%3E%3Ctext x='100' y='175' text-anchor='middle' font-size='14' font-family='Arial' fill='%23333'%3EEstd. 2018%3C/text%3E%3C/svg%3E" alt="Logo 1">
                    </div>

                    <!-- Center Photo Area -->
                    <div class="photo-area">
                        <img id="cardPhoto" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 100'%3E%3Crect width='400' height='100' fill='%23f3f4f6'/%3E%3Ctext x='200' y='50' text-anchor='middle' dominant-baseline='middle' font-size='20' fill='%239ca3af'%3EClick to upload photo%3C/text%3E%3C/svg%3E" alt="News Photo">
                    </div>

                    <!-- Right Logo -->
                    <div class="logo-section right-logo">
                        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%2322c55e'/%3E%3Cpath d='M50 40 Q100 20 150 40 L150 120 Q100 140 50 120 Z' fill='white'/%3E%3Ccircle cx='100' cy='60' r='15' fill='%23dc2626'/%3E%3Cpath d='M100 75 L100 110' stroke='%23000' stroke-width='3' fill='none'/%3E%3Crect x='80' y='35' width='40' height='20' fill='none' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E" alt="Logo 2">
                    </div>
                </div>

                <!-- Text Section Below Card -->
                <div class="text-section">
                    <h3 id="cardHeadline">Your News Headline</h3>
                    <p id="cardDescription">Your news description will appear here</p>
                    <div class="card-footer">
                        <span id="cardDate" class="date-badge">Today</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
